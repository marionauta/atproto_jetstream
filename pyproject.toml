[project]
name = "atproto_jetstream"
version = "0.3.0"
description = "Receive Jetstream events from the AT Protocol"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.13.3",
]

[project.urls]
Repository = "https://tangled.org/@nauta.one/atproto_jetstream"
Issues = "https://tangled.org/@nauta.one/atproto_jetstream/issues"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"
